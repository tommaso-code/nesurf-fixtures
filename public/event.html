<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New England Surf – Tournament Schedule</title>
<meta name="description" content="New England Surf team schedule for a single tournament.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1f3a; --navy-2:#122b4f; --sky:#2ea8e0;
    --bg:#f3f5f8; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --win:#15803d; --loss:#b91c1c; --draw:#a16207;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0b1220; --card:#121a2b; --ink:#e6edf7; --muted:#93a1b5; --line:#22304a; }
  }
  :root[data-theme="dark"]{ --bg:#0b1220; --card:#121a2b; --ink:#e6edf7; --muted:#93a1b5; --line:#22304a; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
  a{color:inherit}
  header{background:linear-gradient(135deg,var(--navy),var(--navy-2) 60%,#163a6b);color:#fff;padding:22px 16px 20px}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  header .wrap{padding:0}
  .brand{display:flex;align-items:center;gap:14px}
  .crest{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5fc6f0,var(--sky) 55%,#0d6fa3);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .club{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;opacity:.85}
  h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;letter-spacing:.5px;margin:2px 0 0;line-height:1.05}
  .dates{margin-top:6px;font-size:14px;opacity:.9}
  main{padding:18px 0 40px}
  h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;letter-spacing:.4px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
  h2 small{font-family:Inter,sans-serif;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
  .card{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .time{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;line-height:1.05}
  .time small{display:block;font-family:Inter,sans-serif;font-weight:600;font-size:10px;letter-spacing:.6px;color:var(--muted);margin-top:3px}
  .t1{font-weight:700}
  .t2{font-size:14px;margin-top:2px}
  .t3{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:5px}
  .score{text-align:right;white-space:nowrap}
  .score b{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700}
  .res{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;color:#fff;vertical-align:3px}
  .res.W{background:var(--win)} .res.L{background:var(--loss)} .res.D{background:var(--draw)}
  .status{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .note{color:var(--muted);font-size:12.5px;margin-top:26px;line-height:1.6}
  .empty{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
  @media (max-width:520px){
    .card{grid-template-columns:70px 1fr;padding:11px 12px}
    .score{grid-column:1/-1;text-align:left;padding-left:82px}
    .time{font-size:17px;white-space:nowrap}
    h1{font-size:25px}
  }
  @media print{ header{background:var(--navy) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact} .card{break-inside:avoid} }
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">
  <div class="crest">NES</div>
  <div>
    <div class="club">New England Surf</div>
    <h1 id="title">Tournament schedule</h1>
    <div class="dates" id="dates"></div>
  </div>
</div></div></header>
<main class="wrap">
  <div id="days"><div class="empty">Loading schedule…</div></div>
  <p class="note" id="note"></p>
</main>
<script>
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const shortTeam = s => s.replace(/^New England Surf( SC)?\s*/i, "").trim() || s;
  const fmtDay = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  const fmtShort = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const id = new URLSearchParams(location.search).get("id") || "";

  async function load(){
    const r = await fetch("data/fixtures.json?t=" + Date.now(), { cache: "no-store" });
    const data = await r.json();
    const fx = data.fixtures.filter(f => id && f.url.includes("/events/" + id + "/"))
      .sort((a, b) => a.sortKey.localeCompare(b.sortKey) || a.surfTeam.localeCompare(b.surfTeam));
    const days = document.getElementById("days");
    if (!fx.length) { days.innerHTML = `<div class="empty">No New England Surf games found for this event${id ? " (" + esc(id) + ")" : ""}.</div>`; return; }

    const name = fx[0].event;
    document.title = `New England Surf – ${name}`;
    document.getElementById("title").textContent = name;
    const ds = [...new Set(fx.map(f => f.date))].sort();
    const first = ds[0], last = ds[ds.length - 1];
    document.getElementById("dates").textContent = first === last ? fmtDay(first) : `${fmtShort(first)} – ${fmtShort(last)}, ${first.slice(0, 4)} · ${fx.length} games`;

    let html = "";
    for (const d of ds) {
      const list = fx.filter(f => f.date === d);
      html += `<h2>${esc(fmtDay(d))} <small>${list.length} game${list.length > 1 ? "s" : ""}</small></h2>`;
      for (const f of list) html += card(f);
    }
    days.innerHTML = html;

    const upd = data.gotsportCapturedAt || data.updatedAt;
    document.getElementById("note").innerHTML =
      `All times local to the venue. Schedule last synced from GotSport ${esc(new Date(upd).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))} — check the <a href="${esc(fx[0].url)}" target="_blank" rel="noopener">official event schedule</a> for late changes.`;
  }

  function card(f){
    const played = f.status === "Played";
    const score = played
      ? `<b>${f.homeScore}–${f.awayScore}</b><span class="res ${f.result}">${f.result}</span>`
      : `<span class="status">${f.status === "Scheduled" ? "" : esc(f.status)}</span>`;
    const vs = f.isHome ? `vs <b>${esc(f.opponent)}</b>` : `vs <b>${esc(f.opponent)}</b>`;
    return `<div class="card">
      <div class="time">${esc(f.time || "TBD")}<small>${f.isHome ? "HOME" : "AWAY"}</small></div>
      <div>
        <div class="t1">${esc(shortTeam(f.surfTeam))}</div>
        <div class="t2">${vs}</div>
        <div class="t3">${f.venue ? `<span>📍 ${esc(f.venue)}</span>` : ""}${f.division ? `<span>🏆 ${esc(f.division)}</span>` : ""}${f.coach ? `<span>👤 ${esc(f.coach)}</span>` : ""}</div>
      </div>
      <div class="score">${score}</div>
    </div>`;
  }
  load().catch(e => { document.getElementById("days").innerHTML = `<div class="empty">Could not load the schedule. Please try again in a minute.</div>`; console.error(e); });
</script>
</body>
</html>
